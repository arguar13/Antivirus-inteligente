name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: ningun job de este pipeline escribe en el repositorio.
permissions:
  contents: read

# Una serie de pushes rapidos no debe dejar ejecuciones obsoletas consumiendo
# runners; solo interesa el resultado del ultimo commit de cada rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (build, test, clippy, formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # El perfil de release activa optimizaciones y LTO, y con ellas lints que
      # el perfil de depuracion no llega a disparar.
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo build --release --workspace
      # Las pruebas que necesitan kernel se saltan solas si el runner no puede
      # cargar eBPF; el resto corre siempre.
      - run: cargo test --workspace

  abi:
    name: Layout del ABI (C == Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Las aserciones const de abi.rs fijan los offsets esperados en Rust,
      # pero no pueden ver el header de C. Sin esta comprobacion cruzada, un
      # cambio en shared/include/aegis_abi.h se manifestaria en produccion como
      # campos desplazados: el agente leyendo un PID donde hay una direccion.
      - run: ./tools/abi-check.sh

  abi-gcc-clang:
    name: Layout del ABI con dos compiladores de C
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # El driver se compila con MSVC en Windows y con clang en Linux. Si el
      # layout dependiera del compilador, el ABI no seria un contrato.
      - run: CC=${{ matrix.cc }} ./tools/abi-check.sh

  supply-chain:
    name: Cadena de suministro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  kernel:
    name: Programas eBPF ante el verificador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libbpf-dev libelf-dev clang
      # Compilar un programa eBPF no demuestra que sea cargable: el verificador
      # rechaza codigo que compila sin un solo warning. Esta es la prueba real.
      - run: make -C drivers/linux/aegis-bpf build
      - run: sudo mount -t tracefs nodev /sys/kernel/tracing || true
      - run: sudo make -C drivers/linux/aegis-bpf verify

  docs:
    name: Enlaces de la documentacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check-links.sh
