# ─────────────────────────────────────────────────────────────────────────────
#  Idioma de los nombres: español
# ─────────────────────────────────────────────────────────────────────────────
#
#  Un solo idioma para nombres de crates y de módulos: el ESPAÑOL, que es el de
#  los identificadores, los comentarios y toda la documentación. Se admiten tal
#  cual las siglas (ipc, pqc, sbom, itdr…) y los nombres propios de formatos
#  (pe, macho).
#
#  El renombrado es PLANIFICADO, no de golpe: renombrar un crate toca todos los
#  Cargo.toml, los `use` y los scripts, y se hace por tandas con su propio CI.
#  Mientras tanto, `cargo xtask nombres` (grupo `arquitectura` de make ci) exige:
#
#    · que todo crate esté en [crates.conformes] o en [crates.pendientes];
#    · que un crate NUEVO nazca conforme (los pendientes no pueden crecer);
#    · que un módulo nuevo no use una palabra del léxico inglés de abajo, salvo
#      los que ya estaban (lista [modulos].pendientes, que solo puede menguar).
#
#  Al renombrar un crate: se cambia el nombre, se mueve su línea de pendientes a
#  conformes y se borra de [modulos].pendientes lo que se haya traducido.

[crates]
conformes = [
    "aegis-entidad", "aegis-presupuesto", "aegis-patron", "aegis-procedencia",
    "aegis-sensor", "aegis-firmware", "aegis-integridad", "aegis-confinar",
    "aegis-emular", "aegis-instrumentar", "aegis-volcado", "aegis-evasion",
    "aegis-disectores", "aegis-captura", "aegis-estado", "aegis-custodia",
    "aegis-invitado", "aegis-almacen", "aegis-almacen-pcap", "aegis-consola",
    "aegis-tejido", "aegis-flujo", "aegis-rango", "aegis-conocimiento",
    "aegis-postura", "aegis-motor", "aegis-trabajador", "aegis-prueba",
    "aegis-contenido",
    # Siglas y nombres propios de formato
    "aegis-pe", "aegis-macho", "aegis-ipc", "aegis-pqc", "aegis-ml",
    "aegis-scal", "aegis-vmi", "aegis-ips", "aegis-sbom", "aegis-itdr",
    "aegis-e2e", "aegis-sigma",
