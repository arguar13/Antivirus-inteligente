[[superficie.extractor]]
tipo = "rpc"
fichero = "server/proto/aegis_fleet.proto"
titulo = "Servicio gRPC estándar (tonic, solo mTLS)"

# ── SLSA v1.0, pista Build ───────────────────────────────────────────────────
#
# nivel 1 a 3: requisitos de la pista Build. nivel 0: garantías complementarias
# que el auditor pide junto a SLSA. El nivel alcanzado lo CALCULA la generación.
# «cumple» exige evidencia, y la evidencia de un «cumple» es la puerta de
# `make ci` que lo hace fallar si deja de ser cierto.

[[slsa]]
nivel = 1
requisito = "Proceso de construcción consistente y guionizado"
estado = "cumple"
evidencia = [
    { fichero = "tools/ci/hermetico.sh", contiene = "args=(build --release --locked" },
    { fichero = "tools/ci-local.sh", contiene = "./tools/ci/hermetico.sh" },
]
detalle = "Un solo guion construye todos los binarios herméticos desde `tools/config/instalables.toml`, con `--locked`, dentro de `make ci`."

[[slsa]]
nivel = 1
requisito = "La procedencia existe y la genera el build"
estado = "cumple"
evidencia = [
    { fichero = "xtask/src/sbom.rs", contiene = "https://slsa.dev/provenance/v1" },
    { fichero = "tools/ci-local.sh", contiene = "cargo xtask sbom --comprobar --dist dist-hermetico" },
]
detalle = "`dist-hermetico/procedencia.intoto.json`: declaración in-toto v1 con predicado SLSA v1 (sujetos con su SHA-256, commit, `Cargo.lock`, toolchain y huella del árbol), escrita por el grupo `auditoria` de `make ci` tras comprobar que los binarios salen de este árbol. Antes solo existía `MANIFIESTO.txt`, texto libre."

[[slsa]]
nivel = 1
requisito = "La procedencia se distribuye con los artefactos"
estado = "parcial"
evidencia = [{ fichero = ".gitignore", contiene = "dist-hermetico/" }]
detalle = "Se escribe junto a los binarios, pero no hay canal de publicación: `dist-hermetico/` está fuera de git y solo existe en la máquina que construye. Hasta que una publicación lleve juntos binarios, `SHA256SUMS`, `sbom/` y `procedencia.intoto.json`, solo la tiene quien recibe el directorio entero."

[[slsa]]
nivel = 2
requisito = "Plataforma de construcción alojada"
estado = "no"
evidencia = [
    { fichero = "docs/ci-remoto.md", contiene = "Máquina dedicada" },
    { fichero = "docs/ci-remoto.md", contiene = "Mientras vive en el PC de desarrollo" },
    { fichero = "docs/07-estado-ci.md", contiene = "GitHub Actions está bloqueado" },
]
detalle = "El runner corre en el PC de desarrollo, dentro de WSL (ver «Donde corre el constructor»), y GitHub Actions está bloqueado a nivel de cuenta."

[[slsa]]
nivel = 2
requisito = "Procedencia auténtica, firmada por la plataforma"
estado = "no"
evidencia = [{ fichero = "crates/aegis-procedencia/src/verificacion.rs", contiene = "pub firma_valida: bool" }]
detalle = "La declaración de procedencia se escribe sin firmar. `aegis-procedencia` no verifica ninguna firma de procedencia: recibe como un booleano el resultado de la firma del artefacto, que verifica `aegis-update`. Sin coste: Sigstore sin clave desde Actions, o `ssh-keygen -Y sign` con una clave de publicación que no viva en el PC de desarrollo."

[[slsa]]
nivel = 3
requisito = "Constructor aislado entre ejecuciones"
estado = "no"
evidencia = [
    { fichero = ".forgejo/workflows/ci.yml", contiene = "Corre en modo host y como root" },
    { fichero = ".forgejo/workflows/ci.yml", contiene = "CARGO_TARGET_DIR: /var/cache/aegis-ci/target" },
]
detalle = "El runner corre en modo host y como root, con caché de compilación compartida entre ejecuciones."

[[slsa]]
nivel = 3
requisito = "Procedencia infalsificable"
estado = "no"
detalle = "Exige que la clave de firma sea inaccesible a los pasos del build (flujo reutilizable tipo `slsa-github-generator`). Se declarará L3 solo cuando `slsa-verifier` lo verifique desde otra máquina."

[[slsa]]
nivel = 0
requisito = "SBOM de cada instalable ligado al Cargo.lock, con licencias"
estado = "cumple"
evidencia = [
    { fichero = "xtask/src/sbom.rs", contiene = '"bomFormat": "CycloneDX"' },
    { fichero = "tools/ci-local.sh", contiene = "cargo xtask sbom --comprobar" },
]
detalle = "CycloneDX 1.5 por instalable en `docs/generado/auditoria/sbom/`. La puerta falla si no corresponde al `Cargo.lock` o si un crate no declara licencia. Declara la licencia del código C incluido; no revisa su cumplimiento."

[[slsa]]
nivel = 0
requisito = "Build reproducible del producto en el mismo constructor"
estado = "cumple"
evidencia = [
    { fichero = "tools/construir-reproducible.sh", contiene = "construir B \"$DIR_B\"" },
    { fichero = "tools/ci-local.sh", contiene = "./tools/construir-reproducible.sh" },
]
detalle = "El grupo `reproducible` de `make ci` construye dos veces los instalables herméticos desde el mismo árbol, en dos directorios de destino (uno desde cero) y con `SOURCE_DATE_EPOCH` del commit, y falla si el SHA-256 de alguno difiere. Es reproducibilidad temporal en esta máquina: mismo compilador, mismo sysroot, misma ruta. No compara esos binarios con los de `dist-hermetico/`, que se construyen con otra lista de remapeos de ruta."

[[slsa]]
nivel = 0
requisito = "Build reproducible verificado desde una segunda máquina"
estado = "no"
evidencia = [{ fichero = "tools/construir-reproducible.sh", contiene = "NO demuestra:" }]
detalle = "Nadie ha reconstruido un commit en otra máquina para comparar los bytes: no hay segunda máquina (el runner es el PC de desarrollo). La toolchain sí está fijada en el repositorio (`rust-toolchain.toml`, `tools/toolchain/fijado.toml` y el sello del sysroot), que es lo que esa segunda máquina tendría que reproducir."

[[slsa]]
nivel = 0
requisito = "Toolchain de Rust fijada"
estado = "cumple"
evidencia = [
    { fichero = "rust-toolchain.toml", contiene = "channel = " },
    { fichero = "tools/toolchain/fijado.toml", contiene = "[rust-std]" },
    { fichero = "tools/toolchain/comprobar_toolchain.sh", contiene = "fijado_sello_valor" },
    { fichero = "tools/ci-local.sh", contiene = "paso toolchain " },
    { fichero = "tools/ci/hermetico.sh", contiene = "comprobar_toolchain.sh" },
]
detalle = "`rust-toolchain.toml` elige el canal y `tools/toolchain/fijado.toml` fija la salida exacta de `rustc` y `cargo`, el SHA-256 de cada `rust-std` y las versiones de los paquetes del sysroot musl. El grupo `toolchain` de `make ci` falla con otro compilador, y `hermetico.sh` no construye nada sin un sysroot sellado por la receta actual con esas versiones. `instalar-runner.sh` y la imagen leen o comprueban el mismo canal."

[[slsa]]
nivel = 0
requisito = "Firma de SHA256SUMS y de los binarios"
estado = "no"
evidencia = [{ fichero = "tools/ci/hermetico.sh", contiene = 'sha256sum "${CONSTRUIDOS[@]}" > SHA256SUMS' }]
detalle = "Las sumas se escriben sin firmar: prueban la integridad frente a un error, no frente a quien pueda reescribir el directorio."
