# ─────────────────────────────────────────────────────────────────────────────
#  Omisiones declaradas de las pruebas (agente y plano de control)
# ─────────────────────────────────────────────────────────────────────────────
#
#  Hallazgos H-10 y H-20. Una prueba de cualquiera de los dos workspaces que no
#  puede ejercerse por falta de algo lo dice con `aegis_prueba::omitir`
#  (crates/aegis-prueba),
#  que la anota en el fichero de AEGIS_OMISIONES. Al final de cada invocacion
#  de `make ci`, tools/ci/omisiones.py las cuenta y las dice; en la tanda
#  COMPLETA, una omision que no este aqui hace fallar la puerta. Un verde con
#  pruebas que no se ejecutaron tiene que decir cuales y por que, o no es un
#  verde.
#
#  Lo que NO se declara aqui: servicios (PostgreSQL, Redis), privilegios (root,
#  ptrace) y kernel (eBPF, BTF, Landlock, seccomp, sondas). La tanda los EXIGE
#  (AEGIS_EXIGIR=servicios,privilegios,kernel): su falta es un fallo del
#  entorno, no una omision admisible, y declararlos hace fallar la
#  comprobacion.
#
#  Formato:
#
#    [[omision]]
#    requisito = "attack"                 # una clave de tools/ci/omisiones.py
#    fichero = "server/crates/.../x.rs"   # donde se llama a omitir(), desde la raiz
#    prueba = "nombre_de_la_prueba"       # opcional: sin el, vale para el fichero
#    motivo = "por que puede faltar en una tanda sana"
#    fase = "la fase que la cierra, y como"
#
#  La lista solo deberia menguar: cada entrada nombra la fase que la cierra.

# ── ATT&CK: el conjunto de datos real de MITRE (unos 31 000 objetos STIX) ────
#
# No esta en el repositorio: lo descarga tools/verificar-conocimiento.sh en
# /opt/aegis-comparativa/attack, y ese grupo (conocimiento) lo EXIGE
# (AEGIS_EXIGIR=...,attack) despues de descargarlo. Los grupos que van antes
# —servidor y share— ejecutan las mismas pruebas y, en un runner limpio, aun no
# lo tienen: ahi la omision es admisible porque el grupo conocimiento las
# ejerce de verdad en la misma tanda.

[[omision]]
requisito = "attack"
fichero = "server/crates/aegis-share/tests/attack.rs"
motivo = "ATT&CK se descarga en el grupo conocimiento, que va despues; ahi se exige"
fase = "MP-16 FASE 4 (medir deteccion y contenido): fijar ATT&CK con su huella en la preparacion del runner (deploy/ci/instalar-runner.sh), antes de la tanda"

[[omision]]
requisito = "attack"
fichero = "server/crates/aegis-conocimiento/tests/attack.rs"
motivo = "ATT&CK se descarga en el grupo conocimiento, que va despues; ahi se exige"
fase = "MP-16 FASE 4 (medir deteccion y contenido): fijar ATT&CK con su huella en la preparacion del runner (deploy/ci/instalar-runner.sh), antes de la tanda"

