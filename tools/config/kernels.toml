# ─────────────────────────────────────────────────────────────────────────────
#  Matriz de kernels y distribuciones
# ─────────────────────────────────────────────────────────────────────────────
#
#  Puerta OBLIGATORIA de make ci (grupo `kernels`): cada imagen arranca en una
#  microVM (KVM para x86-64, emulación completa para aarch64) con el kernel y el
#  espacio de usuario REALES de su distribución —no un kernel suelto sobre el
#  sistema del anfitrión—, y dentro se ejecutan:
#
#    1. `aegis-agent --capacidades --maquina`   qué ofrece ese kernel y qué se degrada
#    2. el verificador del kernel sobre cada objeto eBPF de [[bpf]]
#    3. cada prueba de [[prueba]]
#
#  Uso:   cargo xtask kernels traer        descarga y verifica las imágenes
#         cargo xtask kernels ejecutar     arranca la matriz entera
#         cargo xtask kernels ejecutar --solo debian-12
#
#  Las imágenes se descargan de la distribución y se verifican contra el fichero
#  de sumas que ELLA publica. Se usa la versión vigente («latest»/«current»): la
#  matriz tiene que probar lo que un cliente instala hoy, con sus parches de
#  kernel, y el kernel exacto que arrancó queda en el resultado de cada ejecución.

[vm]
memoria_mib = 2048
cpus = 2
plazo_kvm_s = 600
plazo_emulado_s = 2400

