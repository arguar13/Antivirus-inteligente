# ─────────────────────────────────────────────────────────────────────────────
#  Objetos eBPF: los cinco tienen que pasar el verificador en cada kernel
# ─────────────────────────────────────────────────────────────────────────────

[[bpf]]
objeto = "aegis_probes"

[[bpf]]
objeto = "aegis_xdp"

[[bpf]]
objeto = "aegis_kintegrity"
# Iteradores abiertos de tareas (kernel 6.7+ con BTF). Donde no existen el
# resultado es «no aplica» con el motivo, no un fallo: dice que ESE kernel no
# tiene la capacidad, no que el bytecode esté mal.
#
# Desde 6.7 no hay excusa: los programas son iteradores `iter.s/task` (tipo
# tracing), y para ese tipo el kernel permite estas kfunc desde que existen.
# Un «no aplica» en 6.7+ —por ejemplo, porque alguien vuelva a programas
# `syscall`, que 6.8 rechaza y 6.10 admite— es un FALLO de la matriz.
requiere_kfunc = ["bpf_iter_task_new", "bpf_task_from_pid"]
obligatorio_desde = "6.7"

[[bpf]]
objeto = "aegis_sslsniff"

[[bpf]]
objeto = "aegis_ips"

# ─────────────────────────────────────────────────────────────────────────────
#  Pruebas de extremo a extremo dentro de cada microVM
# ─────────────────────────────────────────────────────────────────────────────

[[prueba]]
id = "agente-en-vivo"
descripcion = "El agente publicado engancha sus sondas, consume actividad real y para limpio sin perder eventos."
tipo = "instalable"
binario = "aegis-agent"

[[prueba]]
id = "red-en-vivo"
descripcion = "Una conexión TCP real llega del kernel con su dirección, su puerto y la marca de loopback."
tipo = "cargo-test"
paquete = "aegis-e2e"
prueba = "red_en_vivo"

[[prueba]]
id = "ejecucion-en-vivo"
descripcion = "Una ejecución llega del kernel con su ruta y sus argumentos exactos."
tipo = "cargo-test"
paquete = "aegis-e2e"
prueba = "ejecucion_en_vivo"

[[prueba]]
id = "ficheros-en-vivo"
descripcion = "Cada vía de apertura para escritura (open, creat, openat, openat2) llega del kernel con su ruta."
tipo = "cargo-test"
paquete = "aegis-e2e"
prueba = "ficheros_en_vivo"

[[prueba]]
id = "prioridad-en-vivo"
descripcion = "Con el ring saturado de aperturas de fichero, ninguna ejecución se pierde: la prioridad baja cede su sitio y la pérdida queda atribuida a su familia."
tipo = "cargo-test"
paquete = "aegis-e2e"
prueba = "prioridad_en_vivo"

[[prueba]]
id = "trabajador-en-vivo"
descripcion = "El trabajador confinado muere varias veces ejecutando ELF malformados y el agente sigue protegiendo: los eventos siguen llegando y el watchdog no lo reinicia."
tipo = "instalable"
binario = "aegis-agent"
acompanantes = ["aegis-watchdog"]

[[prueba]]
id = "rango-en-vivo"
descripcion = "El rango ejecuta emulaciones ATT&CK reales, benignas y reversibles, contra el agente publicado; se cuenta detectada solo la tecnica con una señal del agente en su ventana. Publica cobertura, tiempo hasta deteccion y motor."
tipo = "rango"
binario = "aegis-agent"

[[prueba]]
id = "integridad-en-vivo"
descripcion = "Una puerta trasera en sshd_config (PermitRootLogin yes) con el agente en marcha: el agente dice qué cambió en el fichero y quién lo cambió."
tipo = "instalable"
binario = "aegis-agent"

[[prueba]]
id = "nucleo-en-vivo"
descripcion = "Con la máquina en reposo el verificador cruzado de tareas no acusa a nadie, y un proceso escondido de /proc con un montaje encima sale como oculto-en-userland; donde el kernel no tiene los kfuncs de tareas, el motor queda degradado con su motivo."
tipo = "instalable"
binario = "aegis-agent"

[[prueba]]
id = "paquete-en-vivo"
descripcion = "El paquete .deb o .rpm con el gestor nativo: instalar, actualizar, una versión que no late vuelve sola a la anterior y el gestor la marca fallida, reconciliar, y desinstalar solo con autorización y sin residuos (procesos, unidad, drop-in, /run, cgroups, usuario, ficheros, /etc/aegiscore)."
tipo = "instalable"
binario = "aegis-agent"
acompanantes = ["aegis-watchdog"]
paquetes = true

[[prueba]]
id = "convivencia-en-vivo"
descripcion = "El agente instalado junto a auditd, un segundo consumidor eBPF de los mismos tracepoints y un antivirus ajeno con fanotify que tarda en contestar: nadie ciega a nadie y el camino caliente no espera al analista."
tipo = "instalable"
binario = "aegis-agent"
acompanantes = ["aegis-watchdog"]
paquetes = true

[[prueba]]
id = "sobrecoste-en-vivo"
descripcion = "La misma carga (ejecuciones, ficheros, lecturas) sin y con el agente INSTALADO: sobrecoste, CPU del agente y pico de memoria del servicio frente al techo que calcula aegis-presupuesto. Solo se juzga con KVM."
tipo = "instalable"
binario = "aegis-agent"
acompanantes = ["aegis-watchdog"]
paquetes = true
