# ─────────────────────────────────────────────────────────────────────────────
#  Toolchain FIJADA de las construcciones herméticas
# ─────────────────────────────────────────────────────────────────────────────
#
#  Un artefacto hermético es función del código Y de la toolchain. Si el
#  compilador de Rust, la musl, las cabeceras del kernel o el gcc que compila el
#  C vendorizado (libbpf, libelf, zlib) cambian solos —un `rustup update`, un
#  `apt upgrade`—, el mismo commit produce otro binario y nadie lo sabe.
#
#  Aquí se fija todo lo que entra en ese binario sin ser código del repositorio:
#
#    [rust]          el compilador exacto (y rust-toolchain.toml, que lo elige)
#    [rust-std]      el paquete rust-std de cada objetivo, por su SHA-256: la
#                    biblioteca estándar y la libunwind que preparar_musl.sh copia
#                    al sysroot salen de ahí
#    [sysroot-musl]  los paquetes de la distribución con los que se compone el
#                    sysroot (musl, UAPI del kernel) y se compila el C (gcc,
#                    binutils)
#
#  Lo leen:
#    · tools/toolchain/comprobar_toolchain.sh  la puerta (grupo `toolchain` de
#                                              make ci y tools/ci/hermetico.sh)
#    · tools/toolchain/preparar_musl.sh        no compone un sysroot con otras
#                                              versiones, y graba las que usó en
#                                              el SELLO del sysroot
#
#  El sysroot en sí no se fija aquí por hash: su envoltorio del compilador lleva
#  la ruta donde se instala, así que su huella depende del destino. Se fija por
#  sus ENTRADAS (estas versiones y la receta, preparar_musl.sh) y el SELLO que
#  graba preparar_musl.sh ata esas entradas a la huella del árbol construido.
#
#  Formato: solo `[sección]` y líneas `clave = "valor"`. Lo lee awk
#  (tools/toolchain/fijado.sh); nada de tablas en línea ni valores multilínea.
#
#  Subir una versión es una decisión: se cambia aquí, se rehace el sysroot
#  (tools/toolchain/preparar_musl.sh) y se pasa make ci entero.

[rust]
# Tiene que coincidir con `channel` de rust-toolchain.toml (se comprueba).
canal = "1.94.0"
# Salida exacta de `rustc --version` y `cargo --version`: el hash corto es el
# commit del compilador, así que un rustc compilado aparte con el mismo número
# de versión no pasa.
rustc = "rustc 1.94.0 (4a4ef493e 2026-03-02)"
cargo = "cargo 1.94.0 (85eff7c80 2026-01-15)"
# Fecha del manifiesto del canal con el que rustup instaló la toolchain.
manifiesto = "2026-03-05"

[rust-std]
# `xz_hash` del paquete rust-std de cada objetivo en ese manifiesto: es el
# SHA-256 del paquete que rustup descargó y verificó al instalarlo.
x86_64-unknown-linux-musl = "b6786b5c490df2dcef76829039177799058f94e17725b42f912a057c0f6224f2"
aarch64-unknown-linux-gnu = "c781b3ef4fefa5508fbe05820eddc95e46351d905a30921cc020febd9c596a2e"

[sysroot-musl]
# Distribución de la que salen las versiones de abajo (informativo: se compara
# versión a versión, no el nombre).
distribucion = "Ubuntu 26.04"
# `dpkg-query -W -f='${Version}' <paquete>:<arquitectura nativa>`.
musl = "1.2.5-3build1"
musl-dev = "1.2.5-3build1"
musl-tools = "1.2.5-3build1"
linux-libc-dev = "7.0.0-34.34"
gcc = "4:15.2.0-5ubuntu1"
gcc-15-x86-64-linux-gnu = "15.2.0-16ubuntu1"
binutils-x86-64-linux-gnu = "2.46-3ubuntu2"
