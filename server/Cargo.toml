# Workspace del plano de control de AegisCore (FASE 37).
#
# Es un workspace SEPARADO del agente a proposito. El agente es sincrono, sin
# runtime asincrono, con un presupuesto de memoria estricto (<45 MB) y
# `panic = "abort"`; el servidor es justo lo contrario: asincrono, con tokio,
# axum, tonic y pools de conexiones. Mezclarlos contaminaria el arbol de
# dependencias del agente —que en un EDR ES superficie de ataque— con cientos de
# crates que solo necesita el servidor. Separandolos, la auditoria de la cadena
# de suministro del endpoint sigue siendo corta y revisable.
[workspace]
resolver = "2"
members = ["crates/aegis-server", "crates/aegis-itdr", "crates/aegis-orchestrator", "crates/aegis-predict", "crates/fleet-simulator"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV real: subio a 1.85 en la FASE 55' cuando el servidor paso a EMITIR los OTP
# firmados de autodefensa (aegis-selfdefense -> aegis-pqc[sign] -> ml-dsa, que es
# edicion 2024 y exige rustc 1.85). Mismo criterio que el workspace del agente.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/arguar13/Antivirus-inteligente"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# El perfil de desarrollo lleva `line-tables-only` y no informacion de
# depuracion completa.
#
# POR QUE
# -------
# `debug = true` genera DWARF completo para CADA dependencia del arbol. En este
# proyecto —dos espacios de trabajo, mas de treinta crates propios y un arbol de
# dependencias que incluye rustls, sqlx, tokio y librdkafka— eso son mas de
# quince gigas en `target/`, y la puerta de calidad dejo de caber en el disco de
# la maquina de integracion: `make ci` fallaba por ENOSPC, que se parece mucho a
# un fallo del producto y no lo es.
#
# `line-tables-only` conserva lo unico que se usa de verdad al depurar un fallo
# de prueba —fichero y linea en el backtrace— y quita el resto. Un fallo de CI
# se reproduce en local, donde quien lo investiga puede subir el nivel.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
