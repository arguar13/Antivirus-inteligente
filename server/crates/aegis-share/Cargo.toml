[package]
name = "aegis-share"
description = "Plataforma STIX/TAXII de inteligencia con difusion controlada, federacion y procedencia reversible"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Un paquete STIX es JSON de un desconocido que procesa el plano de control. Se
# analiza con la biblioteca, y los topes —bytes, objetos, propiedades, longitud y
# PROFUNDIDAD— los pone `stix.rs` antes y despues de ella.
serde_json = "1"
# El resumen del contenido de un artefacto, para que el descriptor que firma el
# plano de control cubra lo que de verdad va dentro.
sha2 = "0.10"

[dev-dependencies]
# Omitir una prueba por falta de PostgreSQL, Redis o datos se dice, se cuenta
# y, en make ci, falla (H-10/H-20).
aegis-prueba = { path = "../../../crates/aegis-prueba" }
