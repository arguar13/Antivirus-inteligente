[package]
name = "aegis-server"
description = "Plano de control de AegisCore: ingesta de flota gRPC/mTLS y API de administracion"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# El ciclo de vida del incidente. La logica entera —fusion, transiciones,
# cronologia, rastro encadenado y metricas— vive alli como funciones puras; aqui
# solo se pone en PostgreSQL.
aegis-case = { path = "../aegis-case" }
# RBAC (FASE 6.2): la tabla de roles y permisos de la consola, ahora cableada
# en la API (`crate::autorizacion`). Sin dependencias nuevas: es del workspace.
aegis-consola = { path = "../aegis-consola" }
# --- Transporte nativo de la flota -----------------------------------------
# El agente (aegis-fleet, FASE 34) habla protobuf con el enmarcado de gRPC sobre
# mTLS crudo, NO sobre HTTP/2. Depender del propio crate del agente garantiza que
# el servidor decodifica exactamente lo que el agente codifica: la compatibilidad
# de cable no es una promesa, es el mismo codigo.
aegis-fleet = { path = "../../../crates/aegis-fleet" }
# Valida AegisQL ANTES de difundir: ver la nota en `lanzar_caza` de api.rs.
aegis-parser = { path = "../../../crates/aegis-parser" }
# Entrega de auditoria al SIEM del cliente sin perdida (FASE 46). El destino
# Kafka queda tras una caracteristica porque arrastra una biblioteca en C: quien
# solo integre por syslog no deberia pagarla ni auditarla.
aegis-firehose = { path = "../../../crates/aegis-firehose" }
# Atestacion TPM 2.0 (FASE 49): el plano de control VERIFICA el quote del agente
# antes de creerse su telemetria. La emision del quote (contra el TPM) vive en el
# agente y esta gated; aqui solo se verifica, que es cripto pura.
aegis-attest = { path = "../../../crates/aegis-attest" }
aegis-firmware = { path = "../../../crates/aegis-firmware" }
# Capa PQC del canal C2 (FASE 59): el plano de control guarda su par hibrido,
# abre los sobres sellados que suben los agentes y sella los comandos de vuelta.
# Solo la feature `kem` (intercambio de claves), no la de firma: no arrastra
# ml-dsa y el canal sigue compilando con el MSRV del servidor.
aegis-pqc = { path = "../../../crates/aegis-pqc", default-features = false, features = ["kem"] }
# Autodefensa (FASE 55'): el plano de control EMITE los OTP firmados que son el
# camino de desinstalacion autorizado del dueno de la flota. Arrastra aegis-pqc
# con la feature de firma (ml-dsa), por eso el MSRV del servidor sube a 1.85.
aegis-selfdefense = { path = "../../../crates/aegis-selfdefense" }
# Motor ITDR (FASE 58): deteccion de Kerberoasting, Golden/Silver Ticket y
# escaladas de privilegio sobre el grafo de identidad de la flota. Vive en este
# mismo workspace (el motor de grafos es cosa del Control Plane, no del agente).
aegis-itdr = { path = "../aegis-itdr" }
# Orquestador de remediacion (FASE 64). El servidor no solo lo aloja: lo CONECTA
# al flujo vivo (ver `crate::remediacion`), de modo que un veredicto del motor
# ITDR dispara el playbook sobre la flota sin que intervenga un humano.
aegis-orchestrator = { path = "../aegis-orchestrator" }
aegis-predict = { path = "../aegis-predict" }
getrandom = "0.2"
# Las dos fronteras de la remediacion (el registro y la flota) son traits
# asincronos usados por `dyn`/generico, y las remediaciones de un lote se lanzan
# concurrentemente entre si.
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# --- Runtime asincrono ------------------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }

# --- API REST del panel -----------------------------------------------------
axum = { version = "0.8", features = ["json", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# --- Superficie gRPC estandar (para integraciones de terceros y SIEM) -------
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"

# --- Persistencia -----------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "macros", "migrate", "json", "chrono", "uuid",
    # Tipo INET de PostgreSQL. Se usa para las direcciones de la cuarentena:
    # con clave de texto, "10.0.0.5", "10.0.0.5 " y "010.0.0.5" serian tres
    # cuarentenas distintas para el mismo host, y levantar una dejaria las
    # otras dos puestas. Da soporte directo a std::net::IpAddr, sin envoltorio.
    "ipnet",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# --- Utilidades -------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# PBKDF2-HMAC-SHA256 para las claves de los operadores (H-02). `ring` ya esta
# en el arbol (rustls y tonic con `ring`): declararlo no anade ningun crate.
ring = "0.17"
# Aceptador TLS de la superficie gRPC (H-01): entrega a tonic la MISMA
# configuracion rustls del transporte nativo (`aegis_fleet::tls`). Ya esta en
# el arbol por tonic y fleet-simulator, con las mismas features.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
# Certificado real para el colector syslog de las pruebas de auditoria.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Las pruebas de integracion hablan con PostgreSQL, Redis y mTLS reales.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
# Material de clave REAL para el test de decision de atestacion: se firma un
# quote de verdad y se comprueba que la decision lo acepta o cuarentena.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
# PEM de las identidades de prueba para el cliente TLS de tonic. Ya esta en el
# arbol (aegis-fleet lo usa): no anade ningun crate.
pem = "3"
# Omitir una prueba por falta de PostgreSQL, Redis o datos se dice, se cuenta
# y, en make ci, falla (H-10/H-20).
aegis-prueba = { path = "../../../crates/aegis-prueba" }
