# Auditoria de vulnerabilidades de dependencias (cargo-audit / RustSec).
#
# Complementa a deny.toml (licencias, fuentes, versiones duplicadas) con el
# escaneo diario de la base de avisos de RustSec. Es una de las tres patas del
# pipeline DevSecOps (FASE 35), junto al fuzzing continuo y los sanitizadores.
#
# POLITICA
# --------
# 1. Todo aviso se CORRIGE actualizando la dependencia si existe una version
#    parcheada dentro del rango semver (asi se hizo con `tract-nnef`, subido a
#    0.21.18 para cerrar RUSTSEC-2026-0217).
# 2. Solo se ACEPTA —listado abajo, con justificacion y via de remediacion— el
#    aviso que (a) no tiene arreglo alcanzable sin un salto de version mayor de
#    una dependencia de terceros, Y (b) cuya via de explotacion no aplica a como
#    AegisCore usa el crate.
# 3. Cualquier aviso NUEVO que no este en esta lista rompe el pipeline: obliga a
#    triarlo. La lista se revisa en cada subida de `yara-x`.

[advisories]
# Umbrales de los avisos "informativos": se listan pero no rompen por si solos;
# las vulnerabilidades si.
informational_warnings = ["unmaintained", "unsound", "notice"]

ignore = [
    # --- Subarbol de `yara-x 0.8` -> `wasmtime 22` ---------------------------
    # yara-x compila las reglas YARA a WebAssembly y las ejecuta en wasmtime. El
    # WASM que corre es el que GENERA yara-x a partir de NUESTRAS reglas de
    # confianza, no un modulo WASM de un atacante. Los avisos de wasmtime tratan
    # de escapes del sandbox del INVITADO, de WASI con rutas no confiables y del
    # modelo de componentes: superficies que exigen un invitado o una entrada
    # hostil que AegisCore nunca carga. wasmtime 22 esta fijado por yara-x 0.8;
    # el arreglo llega con un salto mayor de yara-x, que se hara por separado por
    # su impacto en el motor de escaneo (del que dependen cinco crates).
    "RUSTSEC-2024-0438", # wasmtime: sandbox del invitado
    "RUSTSEC-2025-0046", # wasmtime: panico con fd_renumber (WASIp1)
    "RUSTSEC-2025-0118", # wasmtime: API unsound sobre memoria lineal compartida
    "RUSTSEC-2026-0020", # wasmtime: agotamiento de recursos del invitado (WASI)
    "RUSTSEC-2026-0021", # wasmtime: panico en wasi:http/types.fields
    "RUSTSEC-2026-0085", # wasmtime: panico al elevar `flags` del modelo de comp.
    "RUSTSEC-2026-0086", # wasmtime: modelo de componentes
    "RUSTSEC-2026-0087", # wasmtime: f64x2.splat en Cranelift x86-64
    "RUSTSEC-2026-0088", # wasmtime: modelo de componentes
    "RUSTSEC-2026-0089", # wasmtime: modelo de componentes
    "RUSTSEC-2026-0091", # wasmtime: OOB al transcodificar cadenas del modelo comp
    "RUSTSEC-2026-0092", # wasmtime: panico transcodificando UTF-16 desalineado
    "RUSTSEC-2026-0093", # wasmtime: OOB en transcodificacion UTF-16
    "RUSTSEC-2026-0094", # wasmtime: table.grow con backend Winch
    "RUSTSEC-2026-0095", # wasmtime: escape del sandbox con backend Winch
    "RUSTSEC-2026-0096", # wasmtime: miscompilacion de acceso al heap en aarch64
    "RUSTSEC-2026-0222", # wasmtime: mezcla de indices de tipo entre engines
    "RUSTSEC-2026-0269", # wasmtime: escape del sandbox con rutas con barra final

    # `time` (RUSTSEC-2026-0009): DoS por agotamiento de pila en el PARSEO de
    # fechas/horas de texto. AegisCore no parsea fechas de texto: usa `time`
    # (via rcgen) solo para construir la validez de certificados con marcas Unix
    # (`from_unix_timestamp`), que no toca las funciones afectadas. Ademas queda
    # fijado a < 0.3.42 por el subarbol de wasmtime.
    "RUSTSEC-2026-0009",

    # `rsa` (RUSTSEC-2023-0071, "Marvin Attack"): canal lateral de tiempo en el
    # descifrado RSA. Transitivo por yara-x. SIN version parcheada publicada
    # (patched = []). AegisCore no descifra RSA ni atiende operaciones RSA
    # remotas sensibles al tiempo: yara-x lo arrastra para verificar firmas de
    # modulos PE en analisis local. Se retira en cuanto `rsa` publique el arreglo.
    "RUSTSEC-2023-0071",

    # `bincode` (RUSTSEC-2025-0141) y `paste` (RUSTSEC-2024-0436): avisos de
    # "no mantenido", no vulnerabilidades explotables. `paste` es una macro de
    # tiempo de compilacion sin superficie en ejecucion; `bincode` lo arrastra
    # yara-x. Se sustituyen cuando el arbol aguas arriba migre.
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
]
