# Auditoria de vulnerabilidades de dependencias (cargo-audit / RustSec).
#
# Complementa a deny.toml (licencias, fuentes, versiones duplicadas) con el
# escaneo diario de la base de avisos de RustSec. Es una de las tres patas del
# pipeline DevSecOps (FASE 35), junto al fuzzing continuo y los sanitizadores.
#
# POLITICA
# --------
# 1. Todo aviso se CORRIGE actualizando la dependencia si existe una version
#    parcheada dentro del rango semver (asi se hizo con `tract-nnef`, subido a
#    0.21.18 para cerrar RUSTSEC-2026-0217).
# 2. Solo se ACEPTA —listado abajo, con justificacion y via de remediacion— el
#    aviso que (a) no tiene arreglo alcanzable sin un salto de version mayor de
#    una dependencia de terceros, Y (b) cuya via de explotacion no aplica a como
#    AegisCore usa el crate.
# 3. Cualquier aviso NUEVO que no este en esta lista rompe el pipeline: obliga a
#    triarlo. La lista se revisa en cada subida de `yara-x`.

[advisories]
# Umbrales de los avisos "informativos": se listan pero no rompen por si solos;
# las vulnerabilidades si.
informational_warnings = ["unmaintained", "unsound", "notice"]

# Revisada en la FASE 0 del MP-15, la primera vez que esta auditoria corrio de
# verdad en make ci (grupo `cadena`, tools/ci/supply_chain.sh). Se CORRIGIERON de
# raiz: rustls (0.23.45), time (0.3.55, al subir tract a 0.23), hickory-proto
# (0.26, al subir libp2p a 0.57), la pila TLS antigua de ldap3 (rustls 0.21,
# rustls-webpki 0.101, ring 0.16, al subir ldap3 a 0.12), rustls-pemfile
# (sustituido por rustls-pki-types) y quince avisos de wasmtime (al subir el
# oraculo yara-x a 1.21). Lo que queda:
ignore = [
    # `rsa` (RUSTSEC-2023-0071, «Marvin Attack»): fuga por tiempos en operaciones
    # con CLAVE PRIVADA. Sin version corregida. AegisCore usa rsa solo para
    # VERIFICAR (el quote TPM en aegis-attest; yara-x, firmas de PE en pruebas).
    # tools/ci/supply_chain.sh FALLA si aparece un uso de clave privada RSA.
    "RUSTSEC-2023-0071",

    # wasmtime 45 (via yara-x 1.21, DEPENDENCIA DE PRUEBAS: el oraculo de paridad
    # del motor de patrones). Los tres avisos tratan de modulos WASM de un
    # invitado hostil y de WASI con rutas no confiables; el WASM que corre aqui lo
    # genera yara-x desde reglas propias, en el CI, y nunca llega a un binario.
    # No hay version de wasmtime compatible con yara-x 1.21 que los corrija.
    "RUSTSEC-2026-0269", # rutas con barra final en el sandbox de ficheros WASI
    "RUSTSEC-2026-0316", # fuel de llamadas al anfitrion con registros dinamicos
    "RUSTSEC-2026-0222", # mezcla de indices de tipo entre engines
    # Desbordamiento de pila con el resultado de callbacks asincronos del MODELO
    # DE COMPONENTES. yara-x compila wasmtime sin `component-model`: ese codigo no
    # entra ni en el oraculo. Lo corrige wasmtime 48.0.4; yara-x 1.21 (la ultima)
    # fija 45.0.3. tools/ci/supply_chain.sh FALLA si wasmtime llega a algo que se
    # distribuye o si se activa el modelo de componentes.
    "RUSTSEC-2026-0327",

    # Avisos de «sin mantenimiento», no vulnerabilidades:
    "RUSTSEC-2025-0141", # bincode: via yara-x, solo pruebas
    "RUSTSEC-2026-0173", # proc-macro-error2: macro de compilacion de libcrux (ML-KEM), sin codigo en el binario
    "RUSTSEC-2024-0436", # paste: macro de compilacion (libp2p, en swarm-net), sin codigo en el binario
]
