# Inventario de ejemplo. Copiar a inventario.ini y adaptar.
#
# La agrupacion importa: el despliegue avanza por grupos y se detiene si un
# grupo falla, de modo que un error de empaquetado no se lleva por delante la
# flota entera.

[servidores_criticos]
srv-nomina-01.empresa.local
srv-dominio-01.empresa.local

[servidores]
srv-ficheros-[01:40].empresa.local
srv-web-[01:12].empresa.local

[estaciones]
pc-[001:800].empresa.local

[flota:children]
servidores_criticos
servidores
estaciones

[flota:vars]
ansible_user=despliegue
ansible_become=true
ansible_become_method=sudo
