[defaults]
inventory            = inventario.ejemplo.ini
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
# Con miles de endpoints, el valor por defecto (5) convierte un despliegue en
# una tarde entera. 50 conexiones simultaneas es un equilibrio razonable entre
# velocidad y no saturar el bastion.
forks                = 50
timeout              = 30

[ssh_connection]
# La multiplexacion reutiliza la conexion SSH entre tareas: en un playbook de
# veinte tareas por host, ahorra veinte handshakes por cada endpoint.
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
pipelining  = True
