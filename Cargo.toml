[workspace]
resolver = "2"
members = [
    "crates/aegis-ipc",
    "crates/aegis-agent",
    "crates/aegis-vuln",
    "crates/aegis-net",
    "crates/aegis-resp",
    "crates/aegis-scan",
    "crates/aegis-ml",
    "crates/aegis-ransom",
    "crates/aegis-evasion",
    "crates/aegis-intel",
    "crates/aegis-harden",
    "crates/aegis-kguard",
    "crates/aegis-audit",
    "crates/aegis-ctl",
    "crates/aegis-update",
    "crates/aegis-forensics",
    "crates/aegis-sync",
    "crates/aegis-fim",
    "crates/aegis-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV real, no aspiracional. Se subio de 1.77 a 1.82 cuando entro tract-onnx:
# mantener una declaracion que el codigo ya no cumple hace que clippy avise de
# violaciones inexistentes y, peor, oculta las reales.
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/arguar13/Antivirus-inteligente"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Blindaje del binario (FASE 13). `strip = true` elimina la tabla de simbolos Y
# la informacion de depuracion: sin ellas, un desensamblador parte de cero, sin
# nombres de funcion ni lineas de codigo. `debug = false` garantiza que no se
# emita informacion DWARF que reintroduzca esos nombres.
strip = true
debug = false
# Sin nombres de simbolo, los mensajes de panico que incrustan rutas de fichero
# son de lo poco que queda legible en el binario; se recortan.
overflow-checks = true
