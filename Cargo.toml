[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/aegis-parser",
    "crates/aegis-hunt",
    "crates/aegis-scal",
    "crates/aegis-behavior",
    "crates/aegis-kintegrity",
    "crates/aegis-firmware",
    "crates/aegis-unpacker",
    "crates/aegis-syscallguard",
    "crates/aegis-fleet",
    "crates/aegis-sandbox",
    "crates/aegis-deception",
    "crates/aegis-mesh",
    "crates/aegis-ipc",
    "crates/aegis-agent",
    "crates/aegis-vuln",
    "crates/aegis-net",
    "crates/aegis-resp",
    "crates/aegis-scan",
    "crates/aegis-ml",
    "crates/aegis-ransom",
    "crates/aegis-evasion",
    "crates/aegis-intel",
    "crates/aegis-harden",
    "crates/aegis-kguard",
    "crates/aegis-audit",
    "crates/aegis-ctl",
    "crates/aegis-update",
    "crates/aegis-forensics",
    "crates/aegis-sync",
    "crates/aegis-fim",
    "crates/aegis-watchdog",
    "crates/aegis-e2e",
    "crates/aegis-firehose",
    "crates/aegis-attest",
    "crates/aegis-rollback",
    "crates/aegis-ptguard",
    "crates/aegis-honeytoken",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV real, no aspiracional. Se subio de 1.77 a 1.82 cuando entro tract-onnx:
# mantener una declaracion que el codigo ya no cumple hace que clippy avise de
# violaciones inexistentes y, peor, oculta las reales.
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/arguar13/Antivirus-inteligente"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

# El perfil de desarrollo lleva `line-tables-only` y no informacion de
# depuracion completa.
#
# POR QUE
# -------
# `debug = true` genera DWARF completo para CADA dependencia del arbol. En este
# proyecto —dos espacios de trabajo, mas de treinta crates propios y un arbol de
# dependencias que incluye rustls, sqlx, tokio y librdkafka— eso son mas de
# quince gigas en `target/`, y la puerta de calidad dejo de caber en el disco de
# la maquina de integracion: `make ci` fallaba por ENOSPC, que se parece mucho a
# un fallo del producto y no lo es.
#
# `line-tables-only` conserva lo unico que se usa de verdad al depurar un fallo
# de prueba —fichero y linea en el backtrace— y quita el resto. Un fallo de CI
# se reproduce en local, donde quien lo investiga puede subir el nivel.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Blindaje del binario (FASE 13). `strip = true` elimina la tabla de simbolos Y
# la informacion de depuracion: sin ellas, un desensamblador parte de cero, sin
# nombres de funcion ni lineas de codigo. `debug = false` garantiza que no se
# emita informacion DWARF que reintroduzca esos nombres.
strip = true
debug = false
# Sin nombres de simbolo, los mensajes de panico que incrustan rutas de fichero
# son de lo poco que queda legible en el binario; se recortan.
overflow-checks = true
