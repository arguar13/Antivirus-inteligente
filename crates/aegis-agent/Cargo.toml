[package]
name = "aegis-agent"
description = "Agente de deteccion de AegisCore: consumidor de telemetria, grafo de linaje y triaje"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bpf"]
# Carga y consumo real de los programas eBPF. Se desactiva para compilar y
# probar la logica de correlacion en maquinas sin clang, sin BTF o sin
# privilegios: esa logica es la mayor parte del valor y no debe depender de
# poder cargar codigo en el kernel.
bpf = ["dep:libbpf-rs", "dep:libc"]

[dependencies]
aegis-ipc = { path = "../aegis-ipc" }
aegis-ransom = { path = "../aegis-ransom" }
aegis-harden = { path = "../aegis-harden" }
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
dashmap = "6"
thiserror = "2"
libbpf-rs = { version = "0.24", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
anyhow = "1"

[[bin]]
name = "aegis-agent"
path = "src/main.rs"

[build-dependencies]
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
