[package]
name = "aegis-agent"
description = "Agente de deteccion de AegisCore: consumidor de telemetria, grafo de linaje y triaje"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bpf"]
# Carga y consumo real de los programas eBPF. Se desactiva para compilar y
# probar la logica de correlacion en maquinas sin clang, sin BTF o sin
# privilegios: esa logica es la mayor parte del valor y no debe depender de
# poder cargar codigo en el kernel.
bpf = ["dep:libbpf-rs", "dep:libc"]
# Construccion hermetica: libbpf, libelf y zlib se compilan DESDE FUENTE y se
# enlazan estaticamente en vez de tomarse del sistema.
#
# Es lo que hace posible un artefacto universal. Sin esto, libbpf-rs enlaza
# libelf.so y libz.so del anfitrion, y el agente deja de arrancar en cualquier
# distribucion cuyo `libelf.so.1` no sea el que habia en la maquina de
# construccion. Como los tres son dependencias con codigo C, se compilan con el
# compilador del sysroot musl (ver tools/toolchain/preparar_musl.sh), de modo
# que todo el binario habla una unica ABI de libc.
#
# No entra por defecto porque compilar elfutils y zlib en cada `cargo build` de
# desarrollo cuesta minutos y no aporta nada en local.
hermetico = ["bpf", "libbpf-rs/vendored"]
# Enlace ESTATICO contra la libelf y la zlib del sistema (libbpf sigue saliendo
# de su fuente). Es la via del agente cruzado de aarch64 para la matriz de
# kernels: no hay toolchain musl cruzado empaquetado, pero si las bibliotecas
# arm64 de la distribucion por multiarquitectura, y con `+crt-static` el binario
# no depende de la libc del destino (tools/matriz-kernels/construir-cruzado.sh).
estatico-sistema = ["bpf", "libbpf-rs/static"]

[dependencies]
aegis-edgeml = { path = "../aegis-edgeml" }
aegis-scal = { path = "../aegis-scal" }
aegis-behavior = { path = "../aegis-behavior" }
aegis-ipc = { path = "../aegis-ipc" }
aegis-ransom = { path = "../aegis-ransom" }
aegis-harden = { path = "../aegis-harden" }
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
# Contrato unico de motor y arbitro (FASE 1 del MP-16): todo motor del agente
# entra por aqui y solo el arbitro lo invoca. aegis-entidad trae el modelo de
# entidad y la regla de combinacion; ninguno de los dos arrastra crates nuevos.
aegis-motor = { path = "../aegis-motor" }
aegis-entidad = { path = "../aegis-entidad" }
# El trabajador confinado donde corren los parsers de bytes no confiables
# (FASE 1 del MP-16), y el latido que vigila aegis-watchdog.
aegis-trabajador = { path = "../aegis-trabajador" }
aegis-watchdog = { path = "../aegis-watchdog" }
dashmap = "6"
thiserror = "2"
libbpf-rs = { version = "0.24", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
anyhow = "1"
aegis-scal = { path = "../aegis-scal" }

[[bin]]
name = "aegis-agent"
path = "src/main.rs"

[build-dependencies]
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
