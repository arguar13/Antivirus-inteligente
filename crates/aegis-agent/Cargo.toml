[package]
name = "aegis-agent"
description = "Agente de deteccion de AegisCore: consumidor de telemetria, grafo de linaje y triaje"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["bpf"]
# Carga y consumo real de los programas eBPF. Se desactiva para compilar y
# probar la logica de correlacion en maquinas sin clang, sin BTF o sin
# privilegios: esa logica es la mayor parte del valor y no debe depender de
# poder cargar codigo en el kernel.
bpf = ["dep:libbpf-rs", "dep:libc", "dep:aegis-kintegrity"]
# Construccion hermetica: libbpf, libelf y zlib se compilan DESDE FUENTE y se
# enlazan estaticamente en vez de tomarse del sistema.
#
# Es lo que hace posible un artefacto universal. Sin esto, libbpf-rs enlaza
# libelf.so y libz.so del anfitrion, y el agente deja de arrancar en cualquier
# distribucion cuyo `libelf.so.1` no sea el que habia en la maquina de
# construccion. Como los tres son dependencias con codigo C, se compilan con el
# compilador del sysroot musl (ver tools/toolchain/preparar_musl.sh), de modo
# que todo el binario habla una unica ABI de libc.
#
# No entra por defecto porque compilar elfutils y zlib en cada `cargo build` de
# desarrollo cuesta minutos y no aporta nada en local.
hermetico = ["bpf", "libbpf-rs/vendored"]
# Enlace ESTATICO contra la libelf y la zlib del sistema (libbpf sigue saliendo
# de su fuente). Es la via del agente cruzado de aarch64 para la matriz de
# kernels: no hay toolchain musl cruzado empaquetado, pero si las bibliotecas
# arm64 de la distribucion por multiarquitectura, y con `+crt-static` el binario
# no depende de la libc del destino (tools/matriz-kernels/construir-cruzado.sh).
estatico-sistema = ["bpf", "libbpf-rs/static"]

[dependencies]
aegis-edgeml = { path = "../aegis-edgeml" }
aegis-scal = { path = "../aegis-scal" }
aegis-behavior = { path = "../aegis-behavior" }
aegis-ipc = { path = "../aegis-ipc" }
aegis-ransom = { path = "../aegis-ransom" }
aegis-harden = { path = "../aegis-harden" }
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
# Contrato unico de motor y arbitro (FASE 1 del MP-16): todo motor del agente
# entra por aqui y solo el arbitro lo invoca. aegis-entidad trae el modelo de
# entidad y la regla de combinacion; ninguno de los dos arrastra crates nuevos.
aegis-motor = { path = "../aegis-motor" }
aegis-entidad = { path = "../aegis-entidad" }
# El trabajador confinado donde corren los parsers de bytes no confiables
# (FASE 1 del MP-16), y el latido que vigila aegis-watchdog.
aegis-trabajador = { path = "../aegis-trabajador" }
aegis-watchdog = { path = "../aegis-watchdog" }
# Enlace con el plano de control (H-23, E6.5 del MP-16): el cliente mTLS
# SINCRONO de la flota —sin tokio, la misma doctrina de dependencias del agente—
# y el presupuesto de memoria, del que sale el techo de su cola. Ninguno trae un
# crate nuevo: rustls, rcgen y pem ya estan justificados en
# tools/lineabase-agente.txt, y aegis-presupuesto no tiene dependencias.
aegis-fleet = { path = "../aegis-fleet" }
aegis-presupuesto = { path = "../aegis-presupuesto" }
# H-28: la postura de aplicacion (disponible frente a aplicado, con evidencia
# medida sobre el trabajador confinado) la da aegis-enforce. Es de la casa, de
# la capa plataforma, y no trae ningun crate nuevo al agente: aegis-sandbox,
# aegis-scal y thiserror ya estaban.
aegis-enforce = { path = "../aegis-enforce" }
# Ola A de la FASE 2 del MP-16: integridad de ficheros de configuracion por
# significado, forense de memoria en vivo, verificacion cruzada de tareas del
# kernel y balizas de C2 por el ritmo de las conexiones. Todos entran como
# motores detras del arbitro y nacen en solo-auditoria. aegis-l7hunter trae
# tract-onnx, que el agente ya enlazaba por aegis-edgeml.
aegis-integridad = { path = "../aegis-integridad" }
aegis-memhunter = { path = "../aegis-memhunter" }
aegis-l7hunter = { path = "../aegis-l7hunter" }
# Reglas Sigma (FASE 4 del MP-16): el compilador y el evaluador sin retroceso
# compartidos con la fabrica de contenido; motor en solo-auditoria. Sin
# dependencias de terceros (tools/lineabase-agente.txt no cambia).
aegis-sigma = { path = "../aegis-sigma" }
# FASE 5.2 del MP-16: la lectura de la postura del kernel y su linea base viven
# en aegis-vuln (modulo `nucleo`); el agente la relee en caliente como motor.
# Solo arrastra thiserror, que ya estaba.
aegis-vuln = { path = "../aegis-vuln" }
# El canal de contenido firmado (FASE 4.5 del MP-16): el agente solo carga
# reglas y modelos de un paquete con firma hibrida, epoca monotona y anillo.
# Trae aegis-update y aegis-patron, ya en el arbol: ningun crate de terceros
# nuevo (tools/lineabase-agente.txt no cambia).
aegis-contenido = { path = "../aegis-contenido" }
# El verificador eBPF de kintegrity solo existe con la telemetria de kernel.
aegis-kintegrity = { path = "../aegis-kintegrity", optional = true }
# Resumen del contenido ya notificado de un fichero vigilado (integridad).
blake3 = "1"
# El SHA-256 del binario en ejecucion para el autodiagnostico (FASE 7 del
# MP-16): es el resumen de SHA256SUMS y de los paquetes, el que soporte
# compara. Ya justificado en tools/lineabase-agente.txt y en el arbol.
sha2 = "0.10"
dashmap = "6"
thiserror = "2"
libbpf-rs = { version = "0.24", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Omisiones de las pruebas que dependen del entorno, contadas y exigibles.
aegis-prueba = { path = "../aegis-prueba" }
anyhow = "1"
# Para comprobar que lo que el agente manda al plano de control es JSON valido.
serde_json = "1"
aegis-scal = { path = "../aegis-scal" }

[[bin]]
name = "aegis-agent"
path = "src/main.rs"

[build-dependencies]
aegis-kguard = { path = "../aegis-kguard" }
aegis-ctl = { path = "../aegis-ctl" }
