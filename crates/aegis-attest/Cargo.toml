[package]
name = "aegis-attest"
description = "Atestacion remota con raiz de confianza en el TPM 2.0 (FASE 49)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true


[features]
# La emision del quote habla con /dev/tpmrm0 en una maquina con TPM. Aqui no hay
# chip: se compila solo con esta feature, y el CI declara que no se compilo.
tpm-hardware = ["dep:libc"]

[dependencies]
aegis-firmware = { path = "../aegis-firmware" }
thiserror = "2"
sha2 = { version = "0.10", features = ["oid"] }
# Verificacion de la firma del quote, despachada por algoritmo de la AK. El TPM
# real firma con RSA o ECDSA; Ed25519 se soporta por el patron ya usado en
# aegis-update. Solo VERIFICACION en la superficie de produccion: generar claves
# es cosa de las pruebas (dev-dependencies).
ed25519-dalek = "2"
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = "0.16"
signature = "2"
# Nonce aleatorio real para el desafio anti-replay. getrandom, no un PRNG
# sembrado: un desafio predecible es un desafio que un atacante precomputa.
getrandom = "0.2"
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Material de clave REAL en las pruebas: se generan pares, se firma un
# TPMS_ATTEST autentico y el verificador lo comprueba de extremo a extremo. Asi
# se demuestra que aceptara la firma de un TPM real sin tener uno delante.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rsa = { version = "0.9", features = ["std"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
