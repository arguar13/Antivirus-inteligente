[package]
name = "aegis-scan"
description = "Motor de deteccion profunda de AegisCore: YARA sobre ficheros y memoria de procesos"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aegis-scal = { path = "../aegis-scal" }
# EL MOTOR DE PATRONES ES PROPIO (FASE 101). Sustituye a yara-x: coste acotado por
# tipo, tri-estado, determinista y sin retroceso, sin superficie de terceros en el
# camino que come entrada hostil. La paridad con yara-x sobre el conjunto base se
# comprueba en aegis-patron, donde yara-x es solo una dependencia de PRUEBA.
aegis-patron = { path = "../aegis-patron" }
thiserror = "2"
libc = "0.2"
arc-swap = "1"

[dev-dependencies]
# Una prueba que no puede ejercerse lo dice, se cuenta y, si make ci exige lo
# que le falta, falla (H-10/H-20). Solo de pruebas: nunca entra en el binario.
aegis-prueba = { path = "../aegis-prueba" }
