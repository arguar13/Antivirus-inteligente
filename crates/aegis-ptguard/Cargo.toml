[package]
name = "aegis-ptguard"
description = "Trazado de ejecucion por hardware (Intel PT) para detectar ROP/JOP (FASE 51)"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# La captura en vivo abre perf_event_open con PERF_TYPE=intel_pt y mapea el area
# AUX donde la CPU vuelca la traza por DMA. Necesita el flag intel_pt en la CPU y
# perf_event_paranoid bajo. Este Xeon virtual NO tiene intel_pt, asi que la
# captura se compila solo con esta feature y el CI declara que no se ejercio.
pt-live = ["dep:libc", "dep:memmap2"]

[dependencies]
# Desensamblador x86/x64 en Rust puro (sin libs de C -> compatible con apt
# bloqueado): reconstruye los bloques basicos entre saltos para medir gadgets.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
thiserror = "2"
libc = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
