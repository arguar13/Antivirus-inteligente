[package]
name = "aegis-fwaudit"
description = "AegisFirmwareAudit: auditoria estrictamente de solo lectura del firmware — tablas ACPI (WPBT) y ROM SPI (descriptor Intel, volumenes UEFI y ficheros FFS) contra implantes de plataforma"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# El tri-estado del informe (Ok / Fallo / NoAplicable / Indeterminado) y el tipo
# Guid ya existen en la FASE 26 y se reutilizan: dos escalas de veredicto para el
# mismo subsistema harian que "no aplicable" y "fallo" se confundieran, que es
# justo el falso positivo que ese enumerado existe para impedir.
aegis-firmware = { path = "../aegis-firmware" }
# El veredicto de plataforma entra al arbitro como una `Senal` sobre la entidad
# maquina (FASE 92). Un enumerado de veredicto propio seria una regresion de la
# FASE 79: el modelo de entidad es uno.
aegis-entidad = { path = "../aegis-entidad" }
# SHA-256 de cada fichero FFS, para cotejarlo con la linea base conocida.
sha2 = "0.10"
thiserror = "2"
# SOLO para las banderas de apertura (O_RDONLY|O_CLOEXEC|O_NOFOLLOW). No se usa
# para escribir nada: ver `solo_lectura`.
libc = "0.2"

[dev-dependencies]
# Una prueba que no puede ejercerse lo dice, se cuenta y, si make ci exige lo
# que le falta, falla (H-10/H-20). Solo de pruebas: nunca entra en el binario.
aegis-prueba = { path = "../aegis-prueba" }
# La prueba de la garantia de solo lectura SI necesita intentar escribir de
# verdad sobre el descriptor y comprobar que el KERNEL lo rechaza. Afirmar la
# garantia sin ejercerla contra el kernel seria afirmarla sobre el papel.
libc = "0.2"
