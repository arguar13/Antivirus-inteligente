[package]
name = "aegis-fleet"
description = "Agente de gestion de flota sobre gRPC/mTLS con certificados de rotacion automatica y claves que nunca tocan el disco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
# Ya viene en el arbol a traves de rcgen (que lleva su feature `pem` activada):
# declararlo explicitamente no anade ni un crate nuevo a la cadena de suministro,
# y evita escribir a mano un decodificador PEM —mas codigo y mas fallos— solo
# para conservar el DER original del certificado de la CA.
pem = "3"
rustls-pki-types = "1"
zeroize = "1"
sha2 = "0.10"
time = { version = "0.3", default-features = false }
# Capa PQC del canal C2 (FASE 59): sella el payload con el KEM hibrido
# X25519MLKEM768 POR ENCIMA del mTLS. Solo la feature `kem` (no la de firma), asi
# que no arrastra ml-dsa: el canal intercambia claves, no firma binarios.
aegis-pqc = { path = "../aegis-pqc", default-features = false, features = ["kem"] }

[[bin]]
name = "aegis-fleet"
path = "src/main.rs"
