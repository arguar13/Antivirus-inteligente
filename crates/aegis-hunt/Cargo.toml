[package]
name = "aegis-hunt"
description = "AegisQLRunner: ejecucion de consultas AegisQL contra el estado real del endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aegis-parser = { path = "../aegis-parser" }
aegis-scal = { path = "../aegis-scal" }
# Motor YARA para la tabla `memory` (FASE 57): SELECT pid FROM memory WHERE
# yara_match = 'RULE'. aegis-scan (y su yara-x) ya esta en el arbol del agente,
# asi que no suma superficie nueva.
aegis-scan = { path = "../aegis-scan" }
aegis-behavior = { path = "../aegis-behavior" }
# El lado del agente traduce entre el protocolo de flota y el ejecutor. Ver
# `agente.rs`: es codigo del ENDPOINT, no del plano de control.
aegis-fleet = { path = "../aegis-fleet" }
sha2 = "0.10"

[dev-dependencies]
libc = "0.2"
