description = "Lector de ejecutables de Windows (PE/COFF) y del huella Authenticode, endurecido contra entrada hostil"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2"
