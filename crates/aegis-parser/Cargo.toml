[package]
name = "aegis-parser"
description = "AegisQL: lexer, parser y validador del lenguaje de consulta de telemetria de AegisCore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Lexer generado en tiempo de compilacion a partir de patrones. Se prefiere a
# escribir el tokenizador a mano porque el punto delicado de un lexer no es la
# logica sino la EXHAUSTIVIDAD: que ningun byte de la entrada quede sin una
# transicion definida. logos construye un automata completo y convierte en error
# de compilacion cualquier patron ambiguo.
logos = "0.14"

[dev-dependencies]
# El parser es una superficie que recibe texto de un operador remoto: se le pasa
# fuzzing en la FASE 35 y se le exige que jamas entre en panico.
serde_json = "1"
