[package]
name = "aegis-invitado"
description = "Agente invitado de detonacion: traza el comportamiento de una muestra y lo sube por vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# ESTE BINARIO CORRE DENTRO DE LA MAQUINA QUE SE ESTA INFECTANDO.
#
# No es una forma de hablar: la muestra que se detona tiene los mismos permisos
# que el, y en cuanto escala los tiene todos. Cada crate que se enlace aqui es
# codigo que el malware puede intentar subvertir para llegar al anfitrion a
# traves del canal, asi que el arbol se mantiene en lo minimo indispensable:
# `libc` para ptrace y para los limites, y nada mas. Sin serializacion generica,
# sin runtime, sin registro estructurado.
[dependencies]
libc = "0.2"

[[bin]]
name = "aegis-invitado"
path = "src/bin/aegis-invitado.rs"
